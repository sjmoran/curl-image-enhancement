name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: the suite needs no GPU and the CUDA build is 2 GB.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest test_curl.py -q

      - name: Enhance an image end to end
        run: |
          curl-enhance enhance adobe5k_dpe/curl_example_test_input/a4723-_DGW7894.png --out /tmp/out
          test -f /tmp/out/a4723-_DGW7894.png
